<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배포 임팩트 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #fafaf8; --text: #1f1f1d; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f6fde; --accent-soft: #eaf1fd; --up: #18794e; --down: #c4321f; --up-bg: #e6f4ec; --down-bg: #fbe9e6;
    --release: #b8860b; --badge: #efeee9;
    --daily: rgba(47,111,222,0.35); --band-before: rgba(107,107,102,0.10); --band-after: rgba(47,111,222,0.13);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1e1e1c; --surface-2: #232321; --text: #ededea; --muted: #9d9d97; --line: #33332f;
      --accent: #6d9cf0; --accent-soft: #1f2a3d; --up: #4cc38a; --down: #f2735f; --up-bg: #183527; --down-bg: #3a1c17;
      --release: #e0b448; --badge: #2b2b28;
      --daily: rgba(109,156,240,0.40); --band-before: rgba(157,157,151,0.14); --band-after: rgba(109,156,240,0.20);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  button { font: inherit; color: inherit; }

  .top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1320px; margin: 0 auto; padding: 14px 16px 0; }
  .brand { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .demo { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--down-bg); color: var(--down); font-size: 12px; vertical-align: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }

  .layout { max-width: 1320px; margin: 0 auto; padding: 20px 16px 64px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0; }

  /* 배포 목록 */
  .side { position: sticky; top: 112px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  @media (max-width: 860px) { .side { position: static; } }
  .side-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .side-head h2 { font-size: 14px; margin: 0; }
  .list { list-style: none; margin: 0; padding: 6px; max-height: calc(100vh - 190px); overflow-y: auto; }
  @media (max-width: 860px) { .list { max-height: 260px; } }
  .item { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .item:hover { background: var(--surface-2); }
  .item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .group + .group { margin-top: 6px; }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .gh { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 10px 4px; z-index: 1; }
  .item .t { font-weight: 600; grid-column: 1 / 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item .m { grid-row: 1 / 3; grid-column: 2; align-self: center; text-align: right; }
  .item .m small { display: block; color: var(--muted); font-size: 11px; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }
  .empty code { background: var(--badge); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* 상세 */
  .rel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start; margin-bottom: 16px; }
  .rel-head h2 { font-size: 20px; margin: 2px 0 4px; letter-spacing: -0.01em; }
  .rel-head a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 650; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .tile .ba { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .delta { display: inline-block; padding: 1px 7px; border-radius: 6px; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); background: var(--up-bg); }
  .delta.down { color: var(--down); background: var(--down-bg); }
  .delta.flat { color: var(--muted); background: var(--badge); }
  .delta.new, .badge.new { color: var(--accent); background: var(--accent-soft); }
  code.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--badge); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--badge); color: var(--muted); font-size: 11px; font-weight: 500; vertical-align: 2px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font-size: 13px; color: var(--muted); background: var(--surface); border: 0; padding: 6px 11px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  select { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
  .sw-avg { height: 3px; background: var(--accent); }
  .sw-daily { height: 2px; background: var(--daily); }
  .sw-before { background: var(--band-before); border: 1px solid var(--line); }
  .sw-after { background: var(--band-after); }
  .sw-rel { height: 0; width: 14px; border-top: 2px dashed var(--release); border-radius: 0; }
  .chart-wrap { position: relative; height: 340px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .error { color: var(--down); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>배포 임팩트 대시보드<span id="demo" class="demo" hidden>데모 데이터</span></h1>
        <div class="sub" id="meta">불러오는 중…</div>
      </div>
      <div class="sub" id="user"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="제품"></nav>
  </div>
</header>

<div class="layout">
  <aside class="side" aria-label="배포 페이지 목록">
    <div class="side-head"><h2>배포 페이지</h2><span class="sub" id="list-count"></span></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main id="detail">
    <section class="card">
      <div class="rel-head">
        <div>
          <div class="sub" id="rel-date"></div>
          <h2 id="rel-title"></h2>
          <div class="sub" id="rel-sub"></div>
        </div>
        <a id="rel-link" target="_blank" rel="noopener" hidden>배포 상세 보기 ↗</a>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="note" id="kpi-note"></div>
    </section>

    <section class="card" id="chart-card">
      <div class="row">
        <h2 id="chart-title">일별 추이</h2>
        <div class="controls">
          <div class="seg" id="range" role="group" aria-label="차트 기간">
            <button data-days="14">±14일</button><button data-days="30" aria-pressed="true">±30일</button><button data-days="90">±90일</button><button data-days="0">전체</button>
          </div>
          <select id="metric" aria-label="지표 선택"></select>
        </div>
      </div>
      <div class="legend">
        <span><i class="sw sw-avg"></i>7일 평균</span>
        <span><i class="sw sw-daily"></i>일별 값</span>
        <span><i class="sw sw-before"></i><span id="lg-before">배포 전</span></span>
        <span><i class="sw sw-after"></i><span id="lg-after">배포 후</span></span>
        <span><i class="sw sw-rel"></i>배포일</span>
      </div>
      <div class="chart-wrap"><canvas id="chart" role="img" aria-label="선택한 페이지의 배포 전후 지표 추이"></canvas></div>
      <div class="note">선택한 페이지의 배포 전후 구간을 색으로 표시합니다. 같은 제품의 다른 배포일은 흐린 점선이에요. 일별 값은 요일에 따라 출렁이니 7일 평균선으로 흐름을 보세요.</div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const shortDate = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const longDate = (iso) => `${iso.slice(0, 4)}년 ${+iso.slice(5, 7)}월 ${+iso.slice(8, 10)}일 (${WEEK[new Date(iso + "T00:00:00Z").getUTCDay()]})`;
const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PRIMARY = "screenPageViews";

function fmt(v, kind) {
  if (v == null || Number.isNaN(v)) return "–";
  if (kind === "pct") return (v * 100).toFixed(1) + "%";
  if (kind === "sec") { const m = Math.floor(v / 60), s = Math.round(v % 60); return `${m}분 ${String(s).padStart(2, "0")}초`; }
  return Math.round(v).toLocaleString("ko-KR");
}
function deltaHtml(d) {
  if (d == null) return '<span class="delta flat">–</span>';
  const cls = Math.abs(d) < 1 ? "flat" : d > 0 ? "up" : "down";
  const arrow = cls === "up" ? "▲ " : cls === "down" ? "▼ " : "";
  return `<span class="delta ${cls}">${arrow}${Math.abs(d).toFixed(1)}%</span>`;
}
const relKey = (r) => r.key;
const relLabel = (r) => r.name;
const pathText = (r) => (r.paths && r.paths.length ? r.paths.join(", ") + (r.match === "prefix" ? " (하위 경로 포함)" : "") : "사이트 전체");

let DATA, P, SEL, RANGE = 30, chart;

// ---------- 상태 (주소창 #product=…&release=… 로 공유 가능)
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { product: h.get("product"), release: h.get("release") };
}
function writeHash() {
  const h = new URLSearchParams({ product: P.id, ...(SEL ? { release: relKey(SEL) } : {}) });
  history.replaceState(null, "", "#" + h.toString());
}

// ---------- 제품 탭
function renderTabs() {
  $("tabs").innerHTML = DATA.products.map((p) =>
    `<button class="tab" role="tab" data-id="${esc(p.id)}" aria-selected="${p.id === P.id}">${esc(p.name)}<span class="count">${p.pages.length}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => selectProduct(b.dataset.id));
}

function selectProduct(id, releaseKey) {
  P = DATA.products.find((p) => p.id === id) || DATA.products[0];
  SEL = P.pages.find((r) => relKey(r) === releaseKey) || P.pages[0] || null;
  renderTabs(); renderList(); renderDetail(); writeHash();
}

// ---------- 왼쪽: 배포일별 페이지 목록
function renderList() {
  $("list-count").textContent = `${P.pages.length}개 페이지`;
  if (!P.pages.length) {
    $("list").innerHTML = `<li class="empty">아직 등록된 배포 페이지가 없어요.<br><br><code>releases.json</code>에 <code>"product": "${esc(P.id)}"</code>로 페이지를 추가하면 여기에 나타납니다.</li>`;
    return;
  }
  const groups = [];
  P.pages.forEach((r) => { const g = groups.at(-1); if (g && g.date === r.date) g.items.push(r); else groups.push({ date: r.date, items: [r] }); });
  $("list").innerHTML = groups.map((g) => `
    <li class="group"><div class="gh">${longDate(g.date)} 배포</div><ul>${g.items.map((r) => `
      <li><button class="item" data-key="${esc(relKey(r))}" aria-current="${SEL && relKey(r) === relKey(SEL)}">
        <span class="t" title="${esc(r.name)}">${esc(r.name)}${r.complete || r.error ? "" : ` <span class="badge">집계 중</span>`}</span>
        <span class="d" title="${esc(pathText(r))}">${esc(pathText(r))}</span>
        <span class="m">${r.error ? '<span class="delta down">오류</span>' : r.isNew ? '<span class="delta new">신규</span>' : deltaHtml(r.deltaPct[PRIMARY])}<small>조회수</small></span>
      </button></li>`).join("")}</ul></li>`).join("");
  $("list").querySelectorAll(".item").forEach((b) => b.onclick = () => {
    SEL = P.pages.find((r) => relKey(r) === b.dataset.key);
    $("list").querySelectorAll(".item").forEach((x) => x.setAttribute("aria-current", String(x === b)));
    renderDetail(); writeHash();
  });
}

// ---------- 오른쪽 상세
function renderDetail() {
  $("detail").hidden = !SEL;
  if (!SEL) return;
  const W = DATA.windowDays, r = SEL;
  $("rel-date").textContent = `${longDate(r.date)} 배포`;
  $("rel-title").textContent = r.name;
  $("rel-sub").innerHTML = `${esc(P.name)} · <code class="path">${esc(pathText(r))}</code>` +
    (r.error ? "" : r.isNew ? ` <span class="badge new">신규 페이지</span>` : "") +
    (r.complete || r.error ? "" : ` <span class="badge">집계 중 ${r.afterDays}/${W}일</span>`);
  $("rel-link").hidden = !r.url; if (r.url) $("rel-link").href = r.url;
  $("chart-card").hidden = !!r.error;

  if (r.error) {
    $("kpis").innerHTML = "";
    $("kpi-note").innerHTML = `<span class="error">${esc(r.error)}</span><br>서비스 계정이 이 제품의 GA4 속성에 <b>뷰어</b>로 추가됐는지 확인해 주세요.`;
    return;
  }
  $("kpis").innerHTML = Object.entries(DATA.metrics).map(([k, m]) => `
    <div class="tile"><div class="k">${esc(m.label)}</div>
      <div class="v">${fmt(r.after[k], m.fmt)}</div>
      <div>${r.isNew ? '<span class="ba" style="margin:0">배포 전 데이터 없음</span>' : `${deltaHtml(r.deltaPct[k])}<span class="ba">전 ${fmt(r.before[k], m.fmt)}</span>`}</div></div>`).join("");
  const base = r.isNew
    ? `새로 만든 페이지라 배포 전 비교 값이 없어요. 큰 숫자는 배포 후 ${W}일 값입니다.`
    : `이 페이지만의 지표입니다. 큰 숫자는 배포 후 ${W}일 값, 배지는 배포 전 ${W}일 대비 변화율이에요. 합계 지표는 일평균으로 비교해요.`;
  $("kpi-note").textContent = r.complete ? base
    : `배포 후 ${r.afterDays}일치만 반영된 중간 값입니다. GA4 데이터는 이틀 늦게 확정돼서, ${W}일이 다 차면 자동으로 갱신돼요.`;
  drawChart($("metric").value);
}

function chartRows() {
  if (!RANGE) return SEL.daily;
  const from = addDays(SEL.date, -RANGE), to = addDays(SEL.date, RANGE);
  return SEL.daily.filter((d) => d.date >= from && d.date <= to);
}

function drawChart(metric) {
  const meta = DATA.metrics[metric];
  const W = DATA.windowDays;
  const rows = chartRows();
  const labels = rows.map((d) => d.date);
  const values = rows.map((d) => d[metric]);
  const all = SEL.daily, avgMap = {};
  all.forEach((d, i) => { if (i >= 6) avgMap[d.date] = all.slice(i - 6, i + 1).reduce((a, x) => a + x[metric], 0) / 7; });
  const avg = labels.map((d) => avgMap[d] ?? null);

  $("chart-title").textContent = `${meta.label} · 일별 추이`;
  $("lg-before").textContent = `배포 전 ${W}일`;
  $("lg-after").textContent = `배포 후 ${W}일`;

  const first = labels[0], last = labels[labels.length - 1];
  const idx = (iso) => labels.indexOf(iso < first ? first : iso > last ? last : iso);
  const others = [...new Set(P.pages.map((r) => r.date))].filter((d) => d !== SEL.date).map((d) => ({ i: labels.indexOf(d) })).filter((x) => x.i >= 0);
  const sel = SEL && {
    i: labels.indexOf(SEL.date),
    b0: idx(addDays(SEL.date, -W)), b1: idx(addDays(SEL.date, -1)),
    a0: idx(SEL.date), a1: idx(addDays(SEL.date, W - 1)),
    showBefore: addDays(SEL.date, -1) >= first, showAfter: SEL.date <= last,
  };

  const plugin = {
    id: "releases",
    beforeDatasetsDraw(c) {
      if (!sel) return;
      const { ctx, chartArea: a, scales: { x } } = c;
      const step = labels.length > 1 ? x.getPixelForValue(1) - x.getPixelForValue(0) : 0;
      const band = (i0, i1, color) => {
        const l = Math.max(a.left, x.getPixelForValue(i0) - step / 2), rr = Math.min(a.right, x.getPixelForValue(i1) + step / 2);
        if (rr > l) { ctx.fillStyle = color; ctx.fillRect(l, a.top, rr - l, a.bottom - a.top); }
      };
      ctx.save();
      if (sel.showBefore) band(sel.b0, sel.b1, css("--band-before"));
      if (sel.showAfter) band(sel.a0, sel.a1, css("--band-after"));
      ctx.restore();
    },
    afterDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x } } = c;
      ctx.save();
      const vline = (i, width, alpha) => {
        const px = x.getPixelForValue(i);
        ctx.globalAlpha = alpha; ctx.strokeStyle = css("--release"); ctx.setLineDash([4, 4]); ctx.lineWidth = width;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.globalAlpha = 1;
        return px;
      };
      others.forEach((o) => vline(o.i, 1, 0.45));
      if (sel && sel.i >= 0) {
        const px = vline(sel.i, 1.6, 1);
        ctx.font = "600 11px -apple-system, 'Apple SD Gothic Neo', sans-serif";
        const text = `${shortDate(SEL.date)} 배포`;
        const tw = ctx.measureText(text).width + 10;
        const left = px + 4 + tw > a.right ? px - 4 - tw : px + 4;
        ctx.setLineDash([]); ctx.fillStyle = css("--surface"); ctx.fillRect(left, a.top + 2, tw, 18);
        ctx.fillStyle = css("--text"); ctx.textBaseline = "middle"; ctx.fillText(text, left + 5, a.top + 11);
      }
      ctx.restore();
    },
  };

  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels, datasets: [
      { label: "7일 평균", data: avg, borderColor: css("--accent"), borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, order: 1 },
      { label: "일별 값", data: values, borderColor: css("--daily"), borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 3, tension: 0.2, order: 2 },
    ] },
    options: {
      maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--text"), titleColor: css("--surface"), bodyColor: css("--surface"), footerColor: css("--surface"),
          padding: 10, boxPadding: 4,
          callbacks: {
            title: (items) => { const d = labels[items[0].dataIndex]; return `${d} (${WEEK[new Date(d + "T00:00:00Z").getUTCDay()]})`; },
            label: (c) => `${c.dataset.label}: ${fmt(c.parsed.y, meta.fmt)}`,
            footer: (items) => {
              const d = labels[items[0].dataIndex], out = [];
              const names = P.pages.filter((r) => r.date === d).map((r) => r.name);
              if (names.length) out.push(`● 배포: ${clip(names.join(', '), 30)}`);
              if (SEL && d !== SEL.date) {
                if (d > SEL.date && d <= addDays(SEL.date, W - 1)) out.push("선택한 배포의 '배포 후' 구간");
                else if (d >= addDays(SEL.date, -W) && d < SEL.date) out.push("선택한 배포의 '배포 전' 구간");
              }
              return out;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: css("--muted"), maxTicksLimit: 8, maxRotation: 0, callback: (v) => shortDate(labels[v]) }, grid: { display: false }, border: { color: css("--line") } },
        y: { ticks: { color: css("--muted"), maxTicksLimit: 6, callback: (v) => fmt(v, meta.fmt) }, grid: { color: css("--line") }, border: { display: false } },
      },
    },
    plugins: [plugin],
  });
}

// ---------- 시작
fetch("/auth/me", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((u) => { if (u) $("user").innerHTML = `${esc(u.email)} · <a href="/auth/logout" style="color:inherit">로그아웃</a>`; })
  .catch(() => {});

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = data;
    if (data.version !== 2) throw new Error("데이터 형식이 이전 버전입니다. 워크플로를 다시 실행해 주세요.");
    $("demo").hidden = !data.demo;
    $("meta").textContent = `데이터 기준일 ${data.dataThrough} · 갱신 ${data.updatedAt.replace("T", " ").slice(0, 16)}`;
    const sel = $("metric");
    sel.innerHTML = Object.entries(data.metrics).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join("");
    sel.onchange = () => drawChart(sel.value);
    document.querySelectorAll("#range button").forEach((b) => b.addEventListener("click", () => {
      RANGE = Number(b.dataset.days);
      document.querySelectorAll("#range button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      drawChart(sel.value);
    }));
    const h = readHash();
    selectProduct(h.product || data.products[0].id, h.release);
  })
  .catch((e) => { $("meta").innerHTML = `<span class="error">데이터를 불러오지 못했습니다 (${esc(e.message)})</span>`; });
</script>
</body>
</html>
