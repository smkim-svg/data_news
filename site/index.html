<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배포 임팩트 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #fafaf8; --text: #1f1f1d; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f6fde; --accent-soft: #eaf1fd; --up: #18794e; --down: #c4321f; --up-bg: #e6f4ec; --down-bg: #fbe9e6;
    --release: #b8860b; --badge: #efeee9; --cmp: #9a9a93; --all: #1f1f1d;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141413; --surface: #1e1e1c; --surface-2: #232321; --text: #ededea; --muted: #9d9d97; --line: #33332f;
      --accent: #6d9cf0; --accent-soft: #1f2a3d; --up: #4cc38a; --down: #f2735f; --up-bg: #183527; --down-bg: #3a1c17;
      --release: #e0b448; --badge: #2b2b28; --cmp: #85857f; --all: #ededea;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  .top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1320px; margin: 0 auto; padding: 14px 16px 0; }
  .brand { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .demo { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--down-bg); color: var(--down); font-size: 12px; vertical-align: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }

  .layout { max-width: 1320px; margin: 0 auto; padding: 20px 16px 64px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .side, main { min-width: 0; }
  .seg { flex-wrap: wrap; }
  @media (max-width: 640px) { #block { min-width: 0; width: 100%; } .dates { width: 100%; } .dates input[type="date"] { min-width: 0; flex: 1; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0; }

  /* 왼쪽: 배포일별 페이지 목록 */
  .side { position: sticky; top: 112px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  @media (max-width: 860px) { .side { position: static; } }
  .side-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .side-head h2 { font-size: 14px; margin: 0; }
  .list { list-style: none; margin: 0; padding: 6px; max-height: calc(100vh - 190px); overflow-y: auto; }
  @media (max-width: 860px) { .list { max-height: 260px; } }
  .group + .group { margin-top: 6px; }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .gh { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 10px 4px; z-index: 1; }
  .item { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .item:hover { background: var(--surface-2); }
  .item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item .m { grid-row: 1 / 3; grid-column: 2; align-self: center; text-align: right; }
  .item .m small { display: block; color: var(--muted); font-size: 11px; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }
  .empty code { background: var(--badge); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* 상단: 페이지 정보 + 기간 선택 */
  .rel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start; }
  .rel-head h2 { font-size: 20px; margin: 2px 0 4px; letter-spacing: -0.01em; }
  .rel-head a { color: var(--accent); font-size: 13px; text-decoration: none; }
  code.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--badge); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  .period { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 18px 0 6px; padding-top: 16px; border-top: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font-size: 13px; color: var(--muted); background: var(--surface); border: 0; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .dates { display: inline-flex; align-items: center; gap: 6px; }
  #block { min-width: 230px; }
  .dates input[type="date"] { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 140px; }
  .dates input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .period-2 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
  .seg-sm button { padding: 5px 10px; font-size: 12px; }
  .compare { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .compare b { color: var(--text); font-weight: 600; }
  .compare .vs { margin: 0 4px; font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .kpis { align-items: start; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tile-main { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px 10px; cursor: pointer; }
  .tile-main > span { display: block; }
  .tile:hover { border-color: var(--muted); }
  .tile-ch { border-top: 1px solid var(--line); }
  .tile-ch summary { list-style: none; cursor: pointer; padding: 6px 14px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .tile-ch summary::-webkit-details-marker { display: none; }
  .tile-ch summary::after { content: "▾"; font-size: 11px; transition: transform .15s; }
  .tile-ch[open] summary::after { transform: rotate(180deg); }
  .tile-ch summary:hover { color: var(--text); background: var(--surface-2); }
  .tile-ch ul { list-style: none; margin: 0; padding: 2px 14px 10px; }
  .tile-ch li { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 6px; align-items: center; font-size: 12px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .tile-ch li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-ch li .delta { font-size: 11px; padding: 0 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 4px 11px 4px 9px; font-size: 12px; cursor: pointer; }
  .chip .dot { opacity: .35; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: currentColor; background: var(--surface-2); font-weight: 600; }
  .chip[aria-pressed="true"] .dot { opacity: 1; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile-main:focus-visible, .ch tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .hint { font-size: 10px; background: var(--badge); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
  .tile .v { font-size: 22px; font-weight: 650; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .tile .ba { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .delta { display: inline-block; padding: 1px 7px; border-radius: 6px; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); background: var(--up-bg); }
  .delta.down { color: var(--down); background: var(--down-bg); }
  .delta.flat { color: var(--muted); background: var(--badge); }
  .delta.new { color: var(--accent); background: var(--accent-soft); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--badge); color: var(--muted); font-size: 11px; font-weight: 500; vertical-align: 2px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  select { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
  .sw-cur { height: 3px; background: var(--accent); }
  .sw-cmp { height: 0; border-top: 2px dashed var(--cmp); border-radius: 0; }
  .sw-rel { height: 0; width: 14px; border-top: 2px dashed var(--release); border-radius: 0; }
  .chart-wrap { position: relative; height: 340px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .error { color: var(--down); }
  .btn { font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.05); border-color: var(--accent); }
  .btn-danger { color: var(--down); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .head-actions a { margin-right: 4px; }
  .side-head { align-items: center; }
  .loading { color: var(--muted); font-size: 13px; padding: 24px 0; display: flex; align-items: center; gap: 10px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .item .rc { font-size: 10px; color: var(--muted); background: var(--badge); border-radius: 4px; padding: 0 4px; margin-left: 4px; font-weight: 500; vertical-align: 1px; }
  dialog#editor { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--text); }
  dialog#editor::backdrop { background: rgba(0,0,0,.35); }
  #ed-form { padding: 22px; display: grid; gap: 14px; }
  #ed-form h2 { margin: 0; font-size: 17px; }
  #ed-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
  #ed-form label .sub, #ed-form legend .sub { font-weight: 400; }
  #ed-form label.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  #ed-form input:not([type=checkbox]), #ed-form select, #ed-form textarea { font: inherit; font-size: 13px; font-weight: 400; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  #ed-form textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #ed-form fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 8px; }
  #ed-form legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
  .date-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; align-items: center; }
  .date-row .rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; }
  .date-row .rm:hover { color: var(--down); }
  @media (max-width: 520px) { .date-row { grid-template-columns: 1fr auto; } .date-row input[type=text] { grid-column: 1 / -1; } }
  .ed-actions { display: flex; gap: 8px; align-items: center; }
  .ed-actions .spacer { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .ch-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin: 24px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .ch-head h3 { font-size: 14px; margin: 0; }
  .table-scroll { overflow: hidden; }  /* 표는 화면 폭에 맞춰 줄이고(긴 이름은 …), 가로 스크롤은 만들지 않음 */
  table.ch { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ch col.c-name { width: auto; } .ch col.c-num { width: 13%; } .ch col.c-delta { width: 12%; } .ch col.c-share { width: 22%; }
  .ch td.name { overflow: hidden; text-overflow: ellipsis; }
  .ch td.name .dot { margin-right: 8px; }
  .ch .info { color: var(--muted); font-size: 11px; cursor: help; }
  @media (max-width: 640px) { .ch .bar { display: none; } .ch col.c-share { width: 16%; } .ch col.c-num { width: 17%; } .ch th, .ch td { padding: 8px 4px; } table.ch { font-size: 12px; } .ch .delta { padding: 1px 4px; font-size: 11px; } .ch col.c-delta { width: 19%; } }
  .ch th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ch td .sub { font-size: 11px; margin-left: 4px; }
  .ch .num { text-align: right; }
  .ch .muted { color: var(--muted); }
  .ch tbody tr { cursor: pointer; }
  .ch tbody tr:hover { background: var(--surface-2); }
  .ch tbody tr[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .bar { display: inline-block; width: 48px; height: 6px; background: var(--badge); border-radius: 3px; margin-right: 8px; vertical-align: 1px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  #chart-sub a { color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>배포 임팩트 대시보드<span id="demo" class="demo" hidden>데모 데이터</span></h1>
        <div class="sub" id="meta">불러오는 중…</div>
      </div>
      <div class="sub" id="user"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="제품"></nav>
  </div>
</header>

<div class="layout">
  <aside class="side" aria-label="배포 페이지 목록">
    <div class="side-head"><div><h2>배포 페이지</h2><span class="sub" id="list-count"></span></div><button class="btn btn-primary" id="add-page">+ 페이지 추가</button></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main id="detail" hidden>
    <section class="card">
      <div class="rel-head">
        <div>
          <div class="sub" id="rel-date"></div>
          <h2 id="rel-title"></h2>
          <div class="sub" id="rel-sub"></div>
        </div>
        <div class="head-actions">
          <a id="rel-link" target="_blank" rel="noopener" hidden>페이지 열기 ↗</a>
          <button class="btn" id="reload-page" title="GA4에서 다시 불러오기">↻ 다시 불러오기</button>
          <button class="btn" id="edit-page">편집 · 배포일 추가</button>
        </div>
      </div>

      <div class="period" role="group" aria-label="조회 기간">
        <div class="seg" id="units">
          <button data-unit="w1">1주</button><button data-unit="w2">2주</button><button data-unit="w3">3주</button><button data-unit="m1">1달</button><button data-unit="m2">2달</button><button data-unit="m3">3달</button><button data-unit="m6">6개월</button><button data-unit="since">배포 후~현재</button>
        </div>
        <select id="block" aria-label="기간 선택"></select>
        <div class="dates">
          <input type="date" id="from" aria-label="시작일">
          <span class="sub">~</span>
          <input type="date" id="to" aria-label="종료일">
        </div>
      </div>
      <div class="period-2">
        <div class="seg seg-sm" id="modes" role="group" aria-label="비교 기준">
          <button data-mode="prev">이전 기간 대비</button><button data-mode="yoy">전년 같은 기간 대비</button>
        </div>
        <div class="seg seg-sm" id="aggs" role="group" aria-label="숫자 보기 방식">
          <button data-agg="avg" title="기간 동안 하루 평균">일평균</button><button data-agg="sum" title="기간 전체 누적 (사용자는 중복 제거한 순 사용자)">기간 합계</button>
        </div>
        <div class="compare" id="compare"></div>
      </div>

      <div id="kpi-error" class="error" hidden></div>
      <div id="kpi-loading" class="loading" hidden><span class="spin"></span>GA4에서 데이터를 불러오는 중이에요…</div>
      <div class="kpis" id="kpis"></div>
      <div class="note"><span id="kpi-note"></span> <button class="linkbtn" id="fold-all"></button></div>
    </section>

    <section class="card" id="chart-card">
      <div class="row">
        <div>
          <h2 id="chart-title">일별 추이</h2>
          <div class="sub" id="chart-sub"></div>
        </div>
        <select id="metric" aria-label="지표 선택"></select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="차트에 표시할 채널"></div>
      <div class="legend">
        <span><i class="sw sw-cur"></i><span id="lg-cur">선택 기간</span></span>
        <span><i class="sw sw-cmp"></i><span id="lg-cmp">비교 기간</span></span>
        <span><i class="sw sw-rel"></i>배포일</span>
        <span id="rel-out" hidden></span>
      </div>
      <div class="chart-wrap"><canvas id="chart" role="img" aria-label="선택한 페이지의 기간별 지표 추이"></canvas></div>

      <div class="ch-head">
        <h3 id="ch-title">채널별</h3>
        <span class="sub" id="ch-group"></span>
      </div>
      <div class="table-scroll"><table class="ch" id="ch-table"></table></div>
      <div class="note">행을 누르면 위 차트에서 그 채널을 켜고 끌 수 있어요. 한 사람이 여러 채널로 들어올 수 있어서 채널별 사용자 합은 전체보다 클 수 있어요.</div>
    </section>
  </main>
</div>

<dialog id="editor" aria-labelledby="ed-title">
  <form id="ed-form" method="dialog" novalidate>
    <h2 id="ed-title">페이지 추가</h2>
    <label>제품<select id="ed-product" required></select></label>
    <label>페이지 이름<input id="ed-name" maxlength="80" placeholder="예: 요금제 페이지" required></label>
    <label>페이지 주소 <span class="sub">한 줄에 하나씩. 언어별 주소가 여러 개면 모두 적으면 합쳐서 봐요</span>
      <textarea id="ed-urls" rows="3" placeholder="https://www.remotemeeting.com/ko/pricing/"></textarea></label>
    <label class="check"><input type="checkbox" id="ed-prefix"> 하위 경로까지 포함 <span class="sub">(예: /ko/blog/ 아래 모든 글)</span></label>
    <fieldset>
      <legend>배포일 <span class="sub">개선할 때마다 추가하세요</span></legend>
      <div id="ed-dates"></div>
      <button type="button" class="linkbtn" id="ed-add-date">+ 배포일 추가</button>
    </fieldset>
    <label>메모 <span class="sub">(선택)</span><input id="ed-note" maxlength="200" placeholder="예: 히어로 문구·CTA 변경"></label>
    <div class="ed-error error" id="ed-error" hidden></div>
    <div class="ed-actions">
      <button type="button" class="btn btn-danger" id="ed-delete" hidden>삭제</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="ed-cancel">취소</button>
      <button type="submit" class="btn btn-primary" id="ed-save">저장하고 불러오기</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const PRIMARY = "activeUsers";
// 기간 단위: 주는 월~일, 달은 1일~말일, since = 이 페이지 배포일부터 현재까지
const UNITS = {
  w1: { kind: "week", n: 1 }, w2: { kind: "week", n: 2 }, w3: { kind: "week", n: 3 },
  m1: { kind: "month", n: 1 }, m2: { kind: "month", n: 2 }, m3: { kind: "month", n: 3 }, m6: { kind: "month", n: 6 },
  since: { kind: "since" },
};
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const addYears = (iso, n) => { const y = +iso.slice(0, 4) + n, md = iso.slice(5); return md === "02-29" ? `${y}-02-28` : `${y}-${md}`; };
const diffDays = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
const shortDate = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const ymd = (iso) => `${iso.slice(2, 4)}.${iso.slice(5, 7)}.${iso.slice(8, 10)}`;
const dow = (iso) => WEEK[new Date(iso + "T00:00:00Z").getUTCDay()];
const longDate = (iso) => `${iso.slice(0, 4)}년 ${+iso.slice(5, 7)}월 ${+iso.slice(8, 10)}일 (${dow(iso)})`;
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pathText = (r) => (r.paths && r.paths.length ? r.paths.join(", ") + (r.match === "prefix" ? " (하위 경로 포함)" : "") : "사이트 전체");
const mondayOf = (iso) => addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
const monthStart = (iso, back = 0) => { const d = new Date(iso.slice(0, 7) + "-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - back); return d.toISOString().slice(0, 10); };
const monthEnd = (iso) => addDays(monthStart(iso, -1), -1);
const minIso = (a, b) => (a < b ? a : b), maxIso = (a, b) => (a > b ? a : b);
const CH_KO = { "Organic Search": "자연 검색", "Paid Search": "유료 검색", "Direct": "직접 유입", "Referral": "추천(링크)", "Organic Social": "자연 소셜",
  "Paid Social": "유료 소셜", "Email": "이메일", "Display": "디스플레이", "Affiliates": "제휴", "Organic Video": "자연 동영상", "Paid Video": "유료 동영상",
  "Cross-network": "교차 네트워크", "Paid Other": "기타 유료", "Organic Shopping": "자연 쇼핑", "Paid Shopping": "유료 쇼핑", "SMS": "SMS",
  "Mobile Push Notifications": "모바일 푸시", "Audio": "오디오", "Unassigned": "미분류", "(not set)": "(미설정)" };
const chName = (c) => (CH_KO[c] ? `${CH_KO[c]} <span class="sub">${esc(c)}</span>` : esc(c));

function fmt(v, kind) {
  if (v == null || Number.isNaN(v)) return "–";
  if (kind === "pct") return (v * 100).toFixed(1) + "%";
  if (kind === "sec") { const m = Math.floor(v / 60), s = Math.round(v % 60); return m ? `${m}분 ${String(s).padStart(2, "0")}초` : `${s}초`; }
  return Math.round(v).toLocaleString("ko-KR");
}
function deltaHtml(c, key) {
  if (c.state === "loading") return '<span class="delta flat">계산 중…</span>';
  if (c.state === "new") return '<span class="delta new">신규</span>';
  if (c.delta == null) return '<span class="delta flat">–</span>';
  const d = c.delta, lower = DATA.metrics[key].lowerIsBetter;
  if (Math.abs(d) < 1) return `<span class="delta flat">${d > 0 ? "+" : ""}${d.toFixed(1)}%</span>`;
  const good = lower ? d < 0 : d > 0;
  return `<span class="delta ${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(1)}%</span>`;
}

// ---------- 데이터 접근
let DATA, IDX, P, SEL, chart;
const pending = new Map();   // 불러오는 중인 페이지 id → Promise
let PERIOD = { unit: "w1", start: null };   // unit+start 또는 { unit: null, from, to } (직접 선택)
let MODE = "prev";                          // prev: 이전 기간 대비, yoy: 전년 같은 기간 대비
let AGG = "avg";                            // avg: 일평균, sum: 기간 합계 (사용자는 GA4 순 사용자)
const TOT = new Map();                      // 기간 순 사용자 조회 결과 캐시
let ON = null;                              // 차트에 켜 둔 채널 (null = 모든 채널). "전체" 버튼은 모두 켜기/끄기
const OPEN = new Set();                     // 채널별을 펼친 카드
let METRIC = PRIMARY;
const ZERO = () => new Array(DATA.raw.length).fill(0);
const seriesCache = new Map();
/** 페이지의 일별 행 [날짜, 값…]. ch 를 주면 그 채널만 */
function series(page, ch) {
  if (!ch) return page.daily;
  const k = page.key + "§" + ch;
  if (!seriesCache.has(k)) seriesCache.set(k, page.daily.map((r, i) => [r[0], ...((page.channels[ch] || [])[i] || ZERO())]));
  return seriesCache.get(k);
}
const RATES = ["engagementRate", "bounceRate", "sessionKeyEventRate"];
/** 여러 채널을 하루 단위로 합침 (합계는 더하고, 비율은 세션 가중 평균) */
function combine(list) {
  const base = list[0];
  return base.map((r, i) => {
    const out = [r[0], ...ZERO()];
    list.forEach((rows) => DATA.raw.forEach((k, j) => {
      const v = rows[i][j + 1];
      out[j + 1] += RATES.includes(k) ? v * rows[i][IDX.sessions] : v;
    }));
    RATES.forEach((k) => { out[IDX[k]] = out[IDX.sessions] ? out[IDX[k]] / out[IDX.sessions] : 0; });
    return out;
  });
}
/** 제품의 채널 순서(전체 기간 세션 많은 순, 색이 고정되도록 제품 단위로 계산). 8개 넘으면 7개 + 그 외 */
const groupCache = new Map();
function channelGroups(product) {
  if (groupCache.has(product.id)) return groupCache.get(product.id);
  const tot = {};
  product.pages.forEach((pg) => Object.entries(pg.channels || {}).forEach(([ch, rows]) =>
    rows.forEach((r) => { if (r) tot[ch] = (tot[ch] || 0) + r[IDX.sessions - 1]; })));
  const order = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  const top = order.length > 8 ? order.slice(0, 7) : order, rest = order.slice(top.length);
  const g = [...top.map((ch, i) => ({ key: ch, name: ch, color: `--s${i + 1}` })),
    ...(rest.length ? [{ key: "__other", name: `그 외 ${rest.length}개`, color: "--s8", members: rest }] : [])];
  groupCache.set(product.id, g); return g;
}
const ALL = { key: "__all", name: "전체", color: "--all" };
function seriesRows(page, key) {
  if (key === "__all") return page.daily;
  if (key !== "__other") return series(page, key);
  const ck = page.key + "§__other";
  if (!seriesCache.has(ck)) {
    const g = channelGroups(P).find((x) => x.key === "__other");
    seriesCache.set(ck, combine(g.members.map((ch) => series(page, ch))));
  }
  return seriesCache.get(ck);
}
function rowsIn(rows, from, to) { return rows.filter((r) => r[0] >= from && r[0] <= to); }
function aggregate(rows, key, agg = "avg") {
  if (!rows.length) return null;
  const m = DATA.metrics[key], v = (r, k) => r[IDX[k]];
  if (m.agg === "avg") return rows.reduce((a, r) => a + v(r, key), 0) / (agg === "sum" ? 1 : rows.length);
  if (m.agg === "weighted") {
    const s = rows.reduce((a, r) => a + v(r, "sessions"), 0);
    return s ? rows.reduce((a, r) => a + v(r, key) * v(r, "sessions"), 0) / s : 0;
  }
  const den = rows.reduce((a, r) => a + v(r, m.den), 0);
  return den ? rows.reduce((a, r) => a + v(r, m.num), 0) / den : 0;
}
function dayValue(r, key) {
  const m = DATA.metrics[key];
  if (m.agg === "ratio") { const den = r[IDX[m.den]]; return den ? r[IDX[m.num]] / den : 0; }
  return r[IDX[key]];
}

// ---------- 달력 기준 기간
/** 주차: 그 주 목요일이 속한 달 기준 (10/26~11/1 주 → 10월 5주차) */
function weekName(monday) { const thu = addDays(monday, 3); return `${+thu.slice(5, 7)}월 ${Math.ceil(+thu.slice(8, 10) / 7)}주차`; }
function blocks(unit) {
  const u = UNITS[unit], last = DATA.dataThrough, first = DATA.dataFrom, out = [];
  if (u.kind === "week") {
    for (let mon = mondayOf(last); out.length < 80; mon = addDays(mon, -7)) {
      const start = addDays(mon, -7 * (u.n - 1));
      if (start < first) break;
      const fullEnd = addDays(mon, 6);
      out.push({ start, end: minIso(fullEnd, last), fullEnd, name: u.n === 1 ? weekName(mon) : `${weekName(start)} ~ ${weekName(mon)}` });
    }
  } else if (u.kind === "month") {
    for (let back = 0; out.length < 40; back++) {
      const lastMonth = monthStart(last, back), start = monthStart(lastMonth, u.n - 1);
      if (start < first) break;
      const fullEnd = monthEnd(lastMonth), ym = (iso) => `${iso.slice(0, 4)}년 ${+iso.slice(5, 7)}월`;
      out.push({ start, end: minIso(fullEnd, last), fullEnd, name: u.n === 1 ? ym(start) : `${ym(start)} ~ ${+lastMonth.slice(5, 7)}월` });
    }
  }
  return out.map((b) => ({ ...b, partial: b.end < b.fullEnd, days: diffDays(b.start, b.end) + 1 }));
}
/** 배포 후~현재: 고른 배포일 (기본은 가장 최근 배포) */
const sinceStart = () => (SEL.dates.includes(PERIOD.start) ? PERIOD.start : SEL.date);
function currentBlock() {
  if (!PERIOD.unit || PERIOD.unit === "since") return null;
  const list = blocks(PERIOD.unit), picked = list.find((b) => b.start === PERIOD.start);
  if (picked) return picked;
  // 기본값: 주 단위는 진행 중인 주까지 포함한 최신, 달 단위는 마지막으로 끝난 달
  return (UNITS[PERIOD.unit].kind === "month" && list.find((b) => !b.partial)) || list[0];
}
/** 선택 기간 + 비교 기간 */
function range() {
  const last = DATA.dataThrough;
  let from, to, label, partial = false, fullEnd;
  if (PERIOD.unit === "since") {
    from = maxIso(minIso(sinceStart(), last), DATA.dataFrom); to = last; label = `${shortDate(sinceStart())} 배포 후 ~ 현재`;
  } else if (PERIOD.unit) {
    const b = currentBlock(); ({ start: from, end: to, name: label, partial, fullEnd } = b);
    if (partial) label += ` (진행 중 ${b.days}일)`;
  } else {
    ({ from, to } = PERIOD); label = "직접 선택";
  }
  const n = diffDays(from, to) + 1, u = UNITS[PERIOD.unit] || {};
  let pFrom, pTo, cmpName;
  if (MODE === "yoy") {
    // 주 단위는 52주(364일) 전 → 같은 요일끼리, 그 외는 달력상 1년 전
    if (u.kind === "week") { pFrom = addDays(from, -364); pTo = addDays(to, -364); }
    else { pFrom = addYears(from, -1); pTo = u.kind === "month" && !partial ? monthEnd(addYears(to, -1)) : addYears(to, -1); }
    cmpName = "전년 같은 기간";
  } else if (PERIOD.unit === "since") {
    pFrom = addDays(from, -n); pTo = addDays(from, -1); cmpName = "배포 전 같은 일수";
  } else if (u.kind === "week") {
    pFrom = addDays(from, -7 * u.n); pTo = addDays(pFrom, n - 1); cmpName = partial ? "이전 기간의 같은 요일까지" : "이전 기간";
  } else if (u.kind === "month") {
    pFrom = monthStart(from, u.n); pTo = partial ? minIso(addDays(pFrom, n - 1), addDays(from, -1)) : addDays(from, -1);
    cmpName = partial ? "이전 기간의 같은 일수" : "이전 기간";
  } else {
    pFrom = addDays(from, -n); pTo = addDays(from, -1); cmpName = "이전 같은 일수";
  }
  return { from, to, n, pFrom, pTo, label, cmpName };
}
/** 기간 합계 모드에서 순 사용자 (series: "__all" | 채널 | "__other") — 아직 없으면 undefined */
function uniqueUsers(R, series) {
  const t = TOT.get(totKey(R));
  if (!t || t.loading || t.error) return undefined;
  const pick = (part) => {
    if (series === "__all") return part.total;
    if (series === "__other") return channelGroups(P).find((g) => g.key === "__other").members.reduce((a, ch) => a + (part.channels[ch] || 0), 0);
    return part.channels[series] || 0;
  };
  return { cur: pick(t.cur), prev: pick(t.cmp) };
}
const totKey = (R) => `${SEL.key}|${R.from}|${R.to}|${R.pFrom}|${R.pTo}`;
function ensureTotals(R) {
  if (AGG !== "sum" || !SEL || TOT.has(totKey(R))) return;
  const key = totKey(R);
  TOT.set(key, { loading: true });
  api(`/api/totals?id=${encodeURIComponent(SEL.key)}&from=${R.from}&to=${R.to}&pFrom=${R.pFrom}&pTo=${R.pTo}`)
    .then((d) => TOT.set(key, d.error ? { error: d.error } : d))
    .catch((e) => TOT.set(key, { error: e.message }))
    .finally(() => { if (AGG === "sum" && SEL && totKey(range()) === key) renderDetail(); });
}
/** 지표 이름 (기간 합계 모드면 "(일평균)" 대신 합계 표시) */
function metricLabel(k) {
  const m = DATA.metrics[k];
  if (AGG !== "sum" || m.agg !== "avg") return m.label;
  return m.label.replace("(일평균)", k === "activeUsers" ? "(기간 순 사용자)" : "(기간 합계)");
}
/** 선택 기간 vs 비교 기간. series 를 주면 기간 합계 모드에서 사용자를 순 사용자로 */
function compare(rows, key, R = range(), series = null, agg = AGG) {
  const cur = rowsIn(rows, R.from, R.to), prev = rowsIn(rows, R.pFrom, R.pTo);
  let c = aggregate(cur, key, agg), p = aggregate(prev, key, agg);
  if (agg === "sum" && key === "activeUsers" && series) {
    const u = uniqueUsers(R, series);
    if (!u) return { cur: null, prev: null, delta: null, state: "loading" };
    c = u.cur; p = u.prev;
  }
  const need = diffDays(R.pFrom, R.pTo) + 1;
  const users = (rs) => rs.reduce((a, r) => a + r[IDX.activeUsers], 0);
  if (prev.length < need) return { cur: c, prev: p, delta: null, state: "short" };
  if (!users(prev) && users(cur)) return { cur: c, prev: p, delta: null, state: "new" };
  return { cur: c, prev: p, delta: p ? (c - p) / p * 100 : null, state: "ok" };
}

// ---------- 주소창 상태
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("from") && h.get("to")) PERIOD = { unit: null, from: h.get("from"), to: h.get("to") };
  else if (UNITS[h.get("unit")]) PERIOD = { unit: h.get("unit"), start: h.get("start") };
  if (h.get("cmp") === "yoy") MODE = "yoy";
  if (DATA.metrics[h.get("metric")]) METRIC = h.get("metric");
  if (h.get("agg") === "sum") AGG = "sum";
  return { product: h.get("product"), page: h.get("page") };
}
function writeHash() {
  const h = new URLSearchParams({ product: P.id });
  if (SEL) h.set("page", SEL.key);
  if (PERIOD.unit) { h.set("unit", PERIOD.unit); const b = currentBlock(); if (b) h.set("start", b.start); else if (PERIOD.unit === "since" && SEL) h.set("start", sinceStart()); }
  else { h.set("from", PERIOD.from); h.set("to", PERIOD.to); }
  if (MODE === "yoy") h.set("cmp", "yoy");
  if (AGG === "sum") h.set("agg", "sum");
  if (METRIC !== PRIMARY) h.set("metric", METRIC);
  history.replaceState(null, "", "#" + h.toString());
}

// ---------- 제품 탭
function renderTabs() {
  $("tabs").innerHTML = DATA.products.map((p) =>
    `<button class="tab" role="tab" data-id="${esc(p.id)}" aria-selected="${p.id === P.id}">${esc(p.name)}<span class="count">${p.pages.length}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => selectProduct(b.dataset.id));
}
function selectProduct(id, pageKey) {
  P = DATA.products.find((p) => p.id === id) || DATA.products[0];
  SEL = P.pages.find((r) => r.key === pageKey) || P.pages[0] || null;
  ON = null; renderTabs(); renderAll();
  loadProduct(P);
}

// ---------- 서버에서 설정·데이터 불러오기
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  const j = await r.json().catch(() => ({ error: `서버 응답 오류 (${r.status})` }));
  if (!r.ok || (j.error && !j.daily)) throw new Error(j.error || r.status);
  return j;
}
/** /api/config 응답을 화면용 구조로 (이미 받은 데이터는 유지) */
function applyConfig(cfg) {
  const old = new Map((DATA?.products || []).flatMap((p) => p.pages).map((pg) => [pg.key, pg]));
  DATA = { ...cfg, products: cfg.products.map((p) => ({ ...p, pages: [] })) };
  IDX = Object.fromEntries(cfg.raw.map((k, i) => [k, i + 1]));
  for (const pg of cfg.pages) {
    const prod = DATA.products.find((p) => p.id === pg.product);
    if (!prod) continue;
    const dates = pg.releases.map((r) => r.date).sort();
    const prev = old.get(pg.id);
    const same = prev && JSON.stringify([prev.paths, prev.match, prev.releases[0]?.date]) === JSON.stringify([pg.paths, pg.match, pg.releases[0]?.date]);
    prod.pages.push({ ...pg, key: pg.id, date: dates.at(-1), dates,
      ...(same ? { daily: prev.daily, channels: prev.channels, channelGroup: prev.channelGroup, error: prev.error } : {}) });
  }
  DATA.products.forEach((p) => p.pages.sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name)));
  groupCache.clear(); seriesCache.clear();
  $("demo").hidden = !cfg.demo;
  $("meta").textContent = `${longDate(cfg.dataThrough)}까지 데이터` + (cfg.storage === "memory" ? " · ⚠ 저장소 미연결(추가한 페이지가 유지되지 않아요)" : "");
}
function loadPage(pg, refresh) {
  if (!refresh && (pg.daily || pg.error)) return Promise.resolve();
  if (pending.has(pg.key)) return pending.get(pg.key);
  pg.loading = true;
  const job = api(`/api/data?id=${encodeURIComponent(pg.key)}${refresh ? "&refresh=1" : ""}`)
    .then((d) => {
      if (d.error) { pg.error = d.error; pg.daily = null; return; }
      Object.assign(pg, { daily: d.daily, channels: d.channels, channelGroup: d.channelGroup, error: null });
      if (d.dataFrom < DATA.dataFrom) DATA.dataFrom = d.dataFrom;
    })
    .catch((e) => { pg.error = e.message; })
    .finally(() => { pg.loading = false; pending.delete(pg.key); });
  pending.set(pg.key, job);
  return job;
}
async function loadProduct(prod, refreshKey) {
  const jobs = prod.pages.map((pg) => loadPage(pg, pg.key === refreshKey));
  if (!jobs.length) return;
  // 하나 끝날 때마다 화면 갱신 (선택한 페이지가 먼저 보이도록)
  jobs.forEach((j) => j.then(() => { if (P === prod) { groupCache.delete(prod.id); renderList(); if (SEL && !SEL.loading) renderDetail(); } }));
  await Promise.all(jobs);
}
const ready = (pg) => pg && pg.daily && !pg.loading;
function renderAll() { renderList(); renderDetail(); writeHash(); }

// ---------- 왼쪽: 배포일별 페이지 목록 (가장 최근 배포일 기준으로 묶음)
function renderList() {
  $("list-count").textContent = `활성 사용자 · ${MODE === "yoy" ? "전년 대비" : "이전 대비"}`;
  if (!P.pages.length) {
    $("list").innerHTML = `<li class="empty">아직 등록된 페이지가 없어요.<br><br>위의 <b>+ 페이지 추가</b>로 ${esc(P.name)} 페이지와 배포일을 넣으면 바로 GA4에서 불러와요.</li>`;
    return;
  }
  const groups = [];
  P.pages.forEach((r) => { const g = groups.at(-1); if (g && g.date === r.date) g.items.push(r); else groups.push({ date: r.date, items: [r] }); });
  const keepSel = SEL;
  $("list").innerHTML = groups.map((g) => `
    <li class="group"><div class="gh">${longDate(g.date)} 배포</div><ul>${g.items.map((r) => {
      let m;
      if (r.loading || (!r.daily && !r.error)) m = '<span class="spin"></span>';
      else if (r.error) m = '<span class="delta down">오류</span>';
      else { SEL = r; const c = compare(r.daily, PRIMARY, range(), null, "avg"); m = `${deltaHtml(c, PRIMARY)}<small>${fmt(c.cur, "int")}명/일</small>`; }
      return `<li><button class="item" data-key="${esc(r.key)}" aria-current="${keepSel && r.key === keepSel.key}">
        <span class="t" title="${esc(r.name)}">${esc(r.name)}${r.dates.length > 1 ? `<span class="rc">배포 ${r.dates.length}회</span>` : ""}</span>
        <span class="d" title="${esc(pathText(r))}">${esc(pathText(r))}</span>
        <span class="m">${m}</span></button></li>`; }).join("")}</ul></li>`).join("");
  SEL = keepSel;
  $("list").querySelectorAll(".item").forEach((b) => b.onclick = () => {
    SEL = P.pages.find((r) => r.key === b.dataset.key);
    if (PERIOD.unit === "since") PERIOD.start = null;
    $("list").querySelectorAll(".item").forEach((x) => x.setAttribute("aria-current", String(x === b)));
    renderDetail(); writeHash();
  });
}

// ---------- 오른쪽 상세
function syncPeriodControls(R) {
  document.querySelectorAll("#units button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.unit === PERIOD.unit)));
  document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === MODE)));
  const sel = $("block"), showBlocks = PERIOD.unit && PERIOD.unit !== "since";
  sel.hidden = !PERIOD.unit;
  if (PERIOD.unit === "since") {
    const cur = sinceStart();
    sel.innerHTML = [...SEL.dates].reverse().map((d, i) =>
      `<option value="${d}"${d === cur ? " selected" : ""}>${ymd(d)} 배포 후 ~ 현재${i === 0 ? " (최근 배포)" : ""}</option>`).join("");
  }
  if (showBlocks) {
    const cur = currentBlock();
    sel.innerHTML = blocks(PERIOD.unit).map((b) =>
      `<option value="${b.start}"${b.start === cur.start ? " selected" : ""}>${esc(b.name)} · ${shortDate(b.start)}~${shortDate(b.end)}${b.partial ? ` (진행 중 ${b.days}일)` : ""}</option>`).join("");
  }
  for (const id of ["from", "to"]) { $(id).min = DATA.dataFrom; $(id).max = DATA.dataThrough; }
  $("from").value = R.from; $("to").value = R.to;
  $("compare").innerHTML = `<b>${esc(R.label)}</b> ${ymd(R.from)}~${ymd(R.to)} (${R.n}일) <span class="vs">vs</span> <b>${R.cmpName}</b> ${ymd(R.pFrom)}~${ymd(R.pTo)}`;
}

function renderDetail() {
  $("detail").hidden = !SEL;
  if (!SEL) return;
  const r = SEL, R = range();
  const since = diffDays(r.date, DATA.dataThrough);
  $("rel-date").textContent = (r.dates.length > 1 ? `배포 ${r.dates.length}회 · ${r.dates.map(ymd).join(", ")}` : `${longDate(r.date)} 배포`)
    + (since >= 0 ? ` · 최근 배포 후 ${since + 1}일째` : "");
  $("rel-title").textContent = r.name;
  $("rel-sub").innerHTML = `${esc(P.name)} · <code class="path">${esc(pathText(r))}</code>` + (r.note ? ` · ${esc(r.note)}` : "");
  const link = (r.urls || []).find((u) => /^https?:\/\//.test(u));
  $("rel-link").hidden = !link; if (link) $("rel-link").href = link;
  syncPeriodControls(R);

  const loading = !r.error && !ready(r);
  $("kpi-loading").hidden = !loading;
  $("chart-card").hidden = !!r.error || loading;
  $("kpi-error").hidden = !r.error;
  $("reload-page").disabled = !!r.loading;

    $("kpi-error").innerHTML = `${esc(r.error)}<br><span class="sub">권한 문제라면 서비스 계정을 이 제품의 GA4 속성에 <b>뷰어</b>로 추가한 뒤 <b>↻ 다시 불러오기</b>를 눌러 주세요.</span>`;
    return;
  }
  const groups = channelGroups(P);
  ensureTotals(R);
  document.querySelectorAll("#aggs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.agg === AGG)));
  $("kpis").innerHTML = Object.entries(DATA.metrics).map(([k, m]) => {
    const c = compare(r.daily, k, R, "__all");
    const sub = c.state === "loading" ? `<span class="ba" style="margin:0"><span class="spin"></span> GA4에서 순 사용자 계산 중…</span>`
      : c.state === "short" ? `<span class="ba" style="margin:0">비교 기간 데이터 없음</span>`
      : c.state === "new" ? `${deltaHtml(c, k)}<span class="ba">비교 기간엔 방문 없음</span>`
      : `${deltaHtml(c, k)}<span class="ba">비교 ${fmt(c.prev, m.fmt)}</span>`;
    const chRows = groups.map((g) => {
      const cc = compare(seriesRows(r, g.key), k, R, g.key);
      return `<li><i class="dot" style="background:var(${g.color})"></i><span class="n" title="${esc(g.name)}">${esc(g.name)}</span><span>${cc.state === "loading" ? "…" : fmt(cc.cur, m.fmt)}</span>${deltaHtml(cc, k)}</li>`;
    }).join("");
    return `<div class="tile" data-metric="${k}" aria-pressed="${k === METRIC}">
      <button class="tile-main" data-metric="${k}"><span class="k">${esc(metricLabel(k))}${m.lowerIsBetter ? ' <span class="hint">낮을수록 좋음</span>' : ""}</span>
        <span class="v">${c.state === "loading" ? '<span class="sub">…</span>' : fmt(c.cur, m.fmt)}</span><span>${sub}</span></button>
      ${groups.length ? `<details class="tile-ch" data-metric="${k}"${OPEN.has(k) ? " open" : ""}><summary>채널별</summary><ul>${chRows}</ul></details>` : ""}
    </div>`;
  }).join("");
  $("kpis").querySelectorAll(".tile-main").forEach((b) => b.onclick = () => setMetric(b.dataset.metric, true));
  $("kpis").querySelectorAll(".tile-ch").forEach((d) => d.addEventListener("toggle", () => { d.open ? OPEN.add(d.dataset.metric) : OPEN.delete(d.dataset.metric); syncFoldAll(); }));
  syncFoldAll();
  const errT = AGG === "sum" ? TOT.get(totKey(R))?.error : null;
  $("kpi-note").textContent = (AGG === "sum"
    ? "기간 합계: 조회수·세션·키 이벤트는 기간 동안 더한 값, 활성 사용자는 GA4에서 중복을 뺀 순 사용자예요. 비율 지표는 그대로예요."
    : "카드를 누르면 아래 차트가 그 지표로 바뀌어요. 합계 지표는 일평균, 비율 지표는 세션 가중 평균이에요.")
    + (errT ? ` (순 사용자 조회 실패: ${errT})` : "")
    + (R.label.includes("진행 중") ? " 진행 중인 기간은 비교 기간도 같은 일수만큼만 비교해요." : "");
  renderChannels(R);
  drawChart(R);
}

function syncFoldAll() {
  const n = Object.keys(DATA.metrics).length;
  $("fold-all").textContent = OPEN.size === n ? "채널별 모두 접기" : "채널별 모두 펼치기";
  $("fold-all").hidden = !channelGroups(P).length;
}
function setMetric(k, scroll) {
  METRIC = k; $("metric").value = k;
  $("kpis").querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-pressed", String(t.dataset.metric === k)));
  writeHash();

  if (scroll) $("chart-card").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- 채널별 상세 (표 + 차트 토글 버튼)
const channelKeys = () => channelGroups(P).map((g) => g.key);
const onSet = () => ON || new Set(channelKeys());
const allOn = () => channelKeys().every((k) => onSet().has(k));
const isOn = (key) => (key === "__all" ? allOn() : onSet().has(key));
function toggleSeries(key) {
  const cur = onSet();
  if (key === "__all") ON = allOn() ? new Set() : new Set(channelKeys());
  else { cur.has(key) ? cur.delete(key) : cur.add(key); ON = cur; }
  if (ready(SEL)) { const R = range(); renderChannels(R); drawChart(R); }
}
function renderChannels(R) {
  const m = DATA.metrics[METRIC], groups = channelGroups(P);
  const sess = (rows) => rowsIn(rows, R.from, R.to).reduce((a, r) => a + r[IDX.sessions], 0);
  const totalSess = sess(SEL.daily) || 1;
  const all = [ALL, ...groups];
  // 토글 버튼
  $("chips").innerHTML = all.map((g) => `<button class="chip" data-key="${esc(g.key)}" aria-pressed="${isOn(g.key)}"${g.key === "__all" ? ' title="모든 채널 켜기/끄기"' : ""}>${g.key === "__all" ? "" : `<i class="dot" style="background:var(${g.color})"></i>`}${esc(g.name)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => toggleSeries(b.dataset.key));
  // 표
  $("ch-title").textContent = `채널별 · ${metricLabel(METRIC)}`;
  $("ch-group").textContent = SEL.channelGroup ? `기준: ${SEL.channelGroup}` : "";
  $("ch-table").innerHTML = `<colgroup><col class="c-name"><col class="c-num"><col class="c-num"><col class="c-delta"><col class="c-share"></colgroup><thead><tr><th>채널</th><th class="num">선택 기간</th><th class="num" title="${esc(R.cmpName)}">${R.cmpName.includes("전년") ? "전년" : "비교 기간"}</th><th class="num">변화</th><th class="num">세션 비중</th></tr></thead>
    <tbody>${all.map((g) => {
      const rows = seriesRows(SEL, g.key), c = compare(rows, METRIC, R, g.key), s = sess(rows);
      const tip = g.members ? ` title="${esc(g.members.join(", "))}"` : ` title="${esc(g.name)}"`;
      return `<tr data-key="${esc(g.key)}" aria-selected="${isOn(g.key)}" tabindex="0">
        <td class="name"${tip}>${g.key === "__all" ? "<b>전체</b>" : `<i class="dot" style="background:var(${g.color})"></i>${esc(g.name)}${g.members ? ' <span class="info">ⓘ</span>' : ""}`}</td>
        <td class="num">${c.state === "loading" ? "…" : fmt(c.cur, m.fmt)}</td><td class="num muted">${c.state === "short" || c.state === "loading" ? "–" : fmt(c.prev, m.fmt)}</td>
        <td class="num">${deltaHtml(c, METRIC)}</td>
        <td class="num"><span class="bar"><i style="width:${Math.round(s / totalSess * 100)}%"></i></span>${(s / totalSess * 100).toFixed(1)}%</td></tr>`;
    }).join("")}</tbody>`;
  $("ch-table").querySelectorAll("tbody tr").forEach((tr) => {
    tr.onclick = () => toggleSeries(tr.dataset.key);
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSeries(tr.dataset.key); } };
  });
}

// ---------- 차트: 선택 기간(실선) + 비교 기간(점선)을 같은 날짜 순서로 겹쳐 보기
function drawChart(R) {
  const meta = DATA.metrics[METRIC];
  const groups = channelGroups(P);
  // 채널 데이터가 없는 페이지는 전체 선만, 있으면 켜 둔 채널들을 각각 그림
  const shown = groups.length ? groups.filter((g) => onSet().has(g.key)) : [ALL];
  const base = rowsIn(SEL.daily, R.from, R.to), labels = base.map((r) => r[0]);
  const offset = diffDays(R.from, R.pFrom), prevDates = labels.map((d) => addDays(d, offset));
  const single = shown.length === 1;
  const datasets = shown.map((g, i) => {
    const rows = rowsIn(seriesRows(SEL, g.key), R.from, R.to);
    return { label: g.name, data: rows.map((r) => dayValue(r, METRIC)), borderColor: css(g.color), backgroundColor: css(g.color),
      borderWidth: g.key === "__all" ? 2.5 : 2, pointRadius: labels.length <= 31 ? 2.5 : 0, pointHoverRadius: 5, tension: 0.25, order: 1 };
  });
  if (single) {
    const prevMap = Object.fromEntries(rowsIn(seriesRows(SEL, shown[0].key), R.pFrom, R.pTo).map((r) => [r[0], r]));
    datasets.push({ label: R.cmpName, isCmp: true, data: prevDates.map((d) => (prevMap[d] ? dayValue(prevMap[d], METRIC) : null)),
      borderColor: css("--cmp"), backgroundColor: css("--cmp"), borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 4,
      tension: 0.25, spanGaps: true, order: 2 });
  }
  $("chart-title").textContent = `${meta.label} · 일별 추이`;
  $("chart-sub").textContent = !shown.length ? "표시할 채널을 하나 이상 켜 주세요"
    : single ? `${shown[0].name} · 비교 기간과 함께 보는 중` : `채널 ${shown.length}개 표시 중 · 채널을 하나만 켜면 비교 기간 점선이 함께 나와요`;
  $("lg-cur").textContent = `${R.label} (${ymd(R.from)}~${ymd(R.to)})`;
  $("lg-cmp").textContent = `${R.cmpName} (${ymd(R.pFrom)}~${ymd(R.pTo)})`;
  $("lg-cmp").parentElement.hidden = !single;
  document.querySelector(".sw-cur").style.background = shown.length ? css(shown[0].color) : css("--muted");

  const others = [...new Set(P.pages.filter((p) => p !== SEL).flatMap((p) => p.dates))].filter((d) => !SEL.dates.includes(d));
  const marks = [...SEL.dates.map((d) => ({ d, mine: true })), ...others.map((d) => ({ d, mine: false }))]
    .map((m) => ({ ...m, i: labels.indexOf(m.d) })).filter((m) => m.i >= 0);
  const out = $("rel-out"), inRange = SEL.dates.filter((d) => labels.includes(d));
  out.hidden = inRange.length > 0;
  out.textContent = `· 이 페이지 배포일(${SEL.dates.map(shortDate).join(", ")})은 선택 기간 밖이에요`;

  const plugin = {
    id: "releaseMarks",
    beforeDatasetsDraw(c) {
      if (labels.length > 100) return;  // 월요일마다 옅은 세로선
      const { ctx, chartArea: ar, scales: { x } } = c, step = labels.length > 1 ? x.getPixelForValue(1) - x.getPixelForValue(0) : 0;
      ctx.save(); ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
      labels.forEach((d, i) => { if (i && dow(d) === "월") { const px = x.getPixelForValue(i) - step / 2; ctx.beginPath(); ctx.moveTo(px, ar.top); ctx.lineTo(px, ar.bottom); ctx.stroke(); } });
      ctx.restore();
    },
    afterDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x } } = c;
      ctx.save();
      marks.forEach((m) => {
        const px = x.getPixelForValue(m.i);
        ctx.globalAlpha = m.mine ? 1 : 0.45; ctx.strokeStyle = css("--release"); ctx.setLineDash([4, 4]); ctx.lineWidth = m.mine ? 1.6 : 1;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.globalAlpha = 1;
        if (!m.mine) return;
        ctx.font = "600 11px -apple-system, 'Apple SD Gothic Neo', sans-serif";
        const text = `${shortDate(m.d)} 배포`, tw = ctx.measureText(text).width + 10;
        const left = px + 4 + tw > a.right ? px - 4 - tw : px + 4;
        ctx.setLineDash([]); ctx.fillStyle = css("--surface"); ctx.fillRect(left, a.top + 2, tw, 18);
        ctx.fillStyle = css("--text"); ctx.textBaseline = "middle"; ctx.fillText(text, left + 5, a.top + 11);
      });
      ctx.restore();
    },
  };
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--text"), titleColor: css("--surface"), bodyColor: css("--surface"), footerColor: css("--surface"),
          padding: 10, boxPadding: 4, usePointStyle: true,
          callbacks: {
            title: (items) => { const d = labels[items[0].dataIndex]; return `${d} (${dow(d)})`; },
            label: (c) => c.dataset.isCmp
              ? ` 비교 ${prevDates[c.dataIndex].slice(2).replaceAll("-", ".")} (${dow(prevDates[c.dataIndex])}): ${fmt(c.parsed.y, meta.fmt)}`
              : ` ${single ? "" : c.dataset.label + ": "}${fmt(c.parsed.y, meta.fmt)}`,
            footer: (items) => {
              const d = labels[items[0].dataIndex], names = P.pages.filter((p) => p.dates.includes(d)).map((p) => p.name);
              return names.length ? [`● 배포: ${names.join(", ")}`] : [];
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: css("--muted"), maxTicksLimit: 8, maxRotation: 0, callback: (v) => shortDate(labels[v]) }, grid: { display: false }, border: { color: css("--line") } },
        y: { beginAtZero: meta.fmt !== "pct", ticks: { color: css("--muted"), maxTicksLimit: 6, callback: (v) => fmt(v, meta.fmt) }, grid: { color: css("--line") }, border: { display: false } },
      },
    },
    plugins: [plugin],
  });
}

// ---------- 기간·비교 선택
function setUnit(unit) { PERIOD = { unit, start: null }; renderAll(); }
function setBlock(start) { PERIOD = { unit: PERIOD.unit, start }; renderAll(); }
function setMode(mode) { MODE = mode; renderAll(); }

function setCustom() {
  let f = $("from").value, t = $("to").value;
  if (!f || !t) return;
  if (f > t) [f, t] = [t, f];
  PERIOD = { unit: null, from: maxIso(f, DATA.dataFrom), to: minIso(t, DATA.dataThrough) };
  renderAll();
}

// ---------- 페이지 추가·편집
let EDIT = null;   // 편집 중인 페이지 (null = 새로 추가)
function dateRow(date = "", note = "") {
  const row = document.createElement("div");
  row.className = "date-row";
  row.innerHTML = `<input type="date" max="${todayISO()}" value="${esc(date)}" aria-label="배포일"><input type="text" maxlength="100" placeholder="무엇을 바꿨나요? (선택)" value="${esc(note)}" aria-label="배포 메모"><button type="button" class="rm" title="이 배포일 빼기" aria-label="배포일 삭제">×</button>`;
  row.querySelector(".rm").onclick = () => { if ($("ed-dates").children.length > 1) row.remove(); else row.querySelector("input").value = ""; };
  $("ed-dates").append(row);
  return row;
}
const todayISO = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
function openEditor(page) {
  EDIT = page || null;
  $("ed-title").textContent = page ? "페이지 편집 · 배포일 추가" : "페이지 추가";
  $("ed-product").innerHTML = DATA.products.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  $("ed-product").value = page ? page.product : P.id;
  $("ed-name").value = page ? page.name : "";
  $("ed-urls").value = page ? (page.urls || []).join("\n") : "";
  $("ed-prefix").checked = page ? page.match === "prefix" : false;
  $("ed-note").value = page?.note || "";
  $("ed-dates").innerHTML = "";
  (page ? page.releases : [{ date: "" }]).forEach((r) => dateRow(r.date, r.note));
  if (page) dateRow("").querySelector("input").focus();   // 편집할 땐 새 배포일 칸을 하나 열어 둠
  $("ed-error").hidden = true;
  $("ed-delete").hidden = !page; $("ed-delete").dataset.armed = ""; $("ed-delete").textContent = "삭제";
  $("ed-save").disabled = false; $("ed-save").textContent = "저장하고 불러오기";
  $("editor").showModal();
  if (!page) $("ed-name").focus();
}
function editorValue() {
  return {
    product: $("ed-product").value, name: $("ed-name").value.trim(),
    urls: $("ed-urls").value.split(/\n/).map((s) => s.trim()).filter(Boolean),
    match: $("ed-prefix").checked ? "prefix" : "exact", note: $("ed-note").value.trim(),
    releases: [...$("ed-dates").querySelectorAll(".date-row")].map((r) => ({ date: r.querySelector("input[type=date]").value, note: r.querySelector("input[type=text]").value.trim() })).filter((r) => r.date),
  };
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
async function saveEditor(e) {
  e.preventDefault();
  const page = editorValue();
  const showErr = (m) => { $("ed-error").textContent = m; $("ed-error").hidden = false; };
  if (!page.name) return showErr("페이지 이름을 입력해 주세요.");
  if (!page.urls.length) return showErr("페이지 주소를 하나 이상 입력해 주세요.");
  if (!page.releases.length) return showErr("배포일을 하나 이상 입력해 주세요.");
  $("ed-save").disabled = true; $("ed-save").textContent = "저장 중…";
  try {
    const cfg = await api("/api/config", EDIT ? { action: "updatePage", id: EDIT.key, page } : { action: "addPage", page });
    applyConfig(cfg);
    $("editor").close();
    toast(EDIT ? "저장했어요. GA4에서 다시 불러오는 중…" : "추가했어요. GA4에서 불러오는 중…");
    selectProduct(page.product, cfg.savedId);
  } catch (err) {
    showErr(err.message); $("ed-save").disabled = false; $("ed-save").textContent = "저장하고 불러오기";
  }
}
async function deletePage() {
  const b = $("ed-delete");
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "정말 삭제할까요? 한 번 더 누르기"; return; }
  b.disabled = true;
  try {
    const cfg = await api("/api/config", { action: "deletePage", id: EDIT.key });
    const prod = EDIT.product;
    applyConfig(cfg); $("editor").close(); toast("삭제했어요.");
    selectProduct(prod);
  } catch (err) { $("ed-error").textContent = err.message; $("ed-error").hidden = false; }
  b.disabled = false;
}

// ---------- 시작
api("/api/config")
  .then((cfg) => {
    if (cfg.version !== 6) throw new Error("화면과 서버 버전이 맞지 않아요. 새로고침해 주세요.");
    applyConfig(cfg);
    const sel = $("metric");
    sel.innerHTML = Object.entries(DATA.metrics).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join("");
    sel.onchange = () => setMetric(sel.value);
    document.querySelectorAll("#units button").forEach((b) => b.onclick = () => setUnit(b.dataset.unit));
    document.querySelectorAll("#modes button").forEach((b) => b.onclick = () => setMode(b.dataset.mode));
    document.querySelectorAll("#aggs button").forEach((b) => b.onclick = () => setAgg(b.dataset.agg));
    $("block").addEventListener("change", (e) => setBlock(e.target.value));
    $("fold-all").onclick = () => {
      const keys = Object.keys(DATA.metrics), openAll = OPEN.size !== keys.length;
      OPEN.clear(); if (openAll) keys.forEach((k) => OPEN.add(k));
      $("kpis").querySelectorAll(".tile-ch").forEach((d) => { d.open = openAll; });
      syncFoldAll();
    };
    $("from").addEventListener("change", setCustom);
    $("to").addEventListener("change", setCustom);
    $("add-page").onclick = () => openEditor(null);
    $("edit-page").onclick = () => SEL && openEditor(SEL);
    $("reload-page").onclick = () => { if (!SEL) return; for (const k of TOT.keys()) if (k.startsWith(SEL.key + "|")) TOT.delete(k); SEL.daily = null; SEL.error = null; renderAll(); loadProduct(P, SEL.key); };
    $("ed-add-date").onclick = () => dateRow("").querySelector("input").focus();
    $("ed-cancel").onclick = () => $("editor").close();
    $("ed-form").onsubmit = saveEditor;
    $("ed-delete").onclick = deletePage;
    const h = readHash();
    sel.value = METRIC;
    selectProduct(h.product || DATA.products[0].id, h.page);
  })
  .catch((e) => { $("meta").innerHTML = `<span class="error">설정을 불러오지 못했습니다 (${esc(e.message)})</span>`; });
</script>
</body>
</html>
