<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배포 임팩트 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #fafaf8; --text: #1f1f1d; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f6fde; --accent-soft: #eaf1fd; --up: #18794e; --down: #c4321f; --up-bg: #e6f4ec; --down-bg: #fbe9e6;
    --release: #b8860b; --badge: #efeee9; --daily: rgba(47,111,222,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141413; --surface: #1e1e1c; --surface-2: #232321; --text: #ededea; --muted: #9d9d97; --line: #33332f;
      --accent: #6d9cf0; --accent-soft: #1f2a3d; --up: #4cc38a; --down: #f2735f; --up-bg: #183527; --down-bg: #3a1c17;
      --release: #e0b448; --badge: #2b2b28; --daily: rgba(109,156,240,0.40);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  .top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1320px; margin: 0 auto; padding: 14px 16px 0; }
  .brand { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .demo { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--down-bg); color: var(--down); font-size: 12px; vertical-align: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }

  .layout { max-width: 1320px; margin: 0 auto; padding: 20px 16px 64px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0; }

  /* 왼쪽: 배포일별 페이지 목록 */
  .side { position: sticky; top: 112px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  @media (max-width: 860px) { .side { position: static; } }
  .side-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .side-head h2 { font-size: 14px; margin: 0; }
  .list { list-style: none; margin: 0; padding: 6px; max-height: calc(100vh - 190px); overflow-y: auto; }
  @media (max-width: 860px) { .list { max-height: 260px; } }
  .group + .group { margin-top: 6px; }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .gh { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 10px 4px; z-index: 1; }
  .item { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .item:hover { background: var(--surface-2); }
  .item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item .m { grid-row: 1 / 3; grid-column: 2; align-self: center; text-align: right; }
  .item .m small { display: block; color: var(--muted); font-size: 11px; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }
  .empty code { background: var(--badge); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* 상단: 페이지 정보 + 기간 선택 */
  .rel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start; }
  .rel-head h2 { font-size: 20px; margin: 2px 0 4px; letter-spacing: -0.01em; }
  .rel-head a { color: var(--accent); font-size: 13px; text-decoration: none; }
  code.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--badge); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  .period { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 18px 0 6px; padding-top: 16px; border-top: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font-size: 13px; color: var(--muted); background: var(--surface); border: 0; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .dates { display: inline-flex; align-items: center; gap: 6px; }
  .dates input[type="date"] { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 140px; }
  .dates input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .compare { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 650; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .tile .ba { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .delta { display: inline-block; padding: 1px 7px; border-radius: 6px; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--up); background: var(--up-bg); }
  .delta.down { color: var(--down); background: var(--down-bg); }
  .delta.flat { color: var(--muted); background: var(--badge); }
  .delta.new { color: var(--accent); background: var(--accent-soft); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--badge); color: var(--muted); font-size: 11px; font-weight: 500; vertical-align: 2px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  select { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
  .sw-avg { height: 3px; background: var(--accent); }
  .sw-rel { height: 0; width: 14px; border-top: 2px dashed var(--release); border-radius: 0; }
  .chart-wrap { position: relative; height: 340px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .error { color: var(--down); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>배포 임팩트 대시보드<span id="demo" class="demo" hidden>데모 데이터</span></h1>
        <div class="sub" id="meta">불러오는 중…</div>
      </div>
      <div class="sub" id="user"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="제품"></nav>
  </div>
</header>

<div class="layout">
  <aside class="side" aria-label="배포 페이지 목록">
    <div class="side-head"><h2>배포 페이지</h2><span class="sub" id="list-count"></span></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main id="detail" hidden>
    <section class="card">
      <div class="rel-head">
        <div>
          <div class="sub" id="rel-date"></div>
          <h2 id="rel-title"></h2>
          <div class="sub" id="rel-sub"></div>
        </div>
        <a id="rel-link" target="_blank" rel="noopener" hidden>페이지 열기 ↗</a>
      </div>

      <div class="period" role="group" aria-label="조회 기간">
        <div class="seg" id="presets">
          <button data-days="7">최근 7일</button><button data-days="14">14일</button><button data-days="30">30일</button><button data-days="90">90일</button><button data-days="180">180일</button>
        </div>
        <div class="dates">
          <input type="date" id="from" aria-label="시작일">
          <span class="sub">~</span>
          <input type="date" id="to" aria-label="종료일">
        </div>
      </div>
      <div class="compare" id="compare"></div>

      <div id="kpi-error" class="error" hidden></div>
      <div class="kpis" id="kpis"></div>
      <div class="note">큰 숫자는 선택한 기간 값, 배지는 바로 앞 같은 길이 기간 대비 변화율입니다. 합계 지표는 일평균, 비율 지표는 세션 가중 평균으로 계산해요.</div>
    </section>

    <section class="card" id="chart-card">
      <div class="row">
        <h2 id="chart-title">일별 추이</h2>
        <select id="metric" aria-label="지표 선택"></select>
      </div>
      <div class="legend">
        <span><i class="sw sw-avg"></i>일별 값</span>
        <span><i class="sw sw-rel"></i>배포일</span>
        <span id="rel-out" hidden></span>
      </div>
      <div class="chart-wrap"><canvas id="chart" role="img" aria-label="선택한 페이지의 기간별 지표 추이"></canvas></div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const PRIMARY = "activeUsers";
const PRESETS = [7, 14, 30, 90, 180];
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
const shortDate = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const dow = (iso) => WEEK[new Date(iso + "T00:00:00Z").getUTCDay()];
const longDate = (iso) => `${iso.slice(0, 4)}년 ${+iso.slice(5, 7)}월 ${+iso.slice(8, 10)}일 (${dow(iso)})`;
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pathText = (r) => (r.paths && r.paths.length ? r.paths.join(", ") + (r.match === "prefix" ? " (하위 경로 포함)" : "") : "사이트 전체");

function fmt(v, kind) {
  if (v == null || Number.isNaN(v)) return "–";
  if (kind === "pct") return (v * 100).toFixed(1) + "%";
  if (kind === "sec") { const m = Math.floor(v / 60), s = Math.round(v % 60); return m ? `${m}분 ${String(s).padStart(2, "0")}초` : `${s}초`; }
  return Math.round(v).toLocaleString("ko-KR");
}
function deltaHtml(c) {
  if (c.state === "new") return '<span class="delta new">신규</span>';
  if (c.delta == null) return '<span class="delta flat">–</span>';
  const d = c.delta, cls = Math.abs(d) < 1 ? "flat" : d > 0 ? "up" : "down";
  const arrow = cls === "up" ? "▲ " : cls === "down" ? "▼ " : "";
  return `<span class="delta ${cls}">${arrow}${Math.abs(d).toFixed(1)}%</span>`;
}

// ---------- 집계 (일별 원본 값 → 기간 값)
let DATA, IDX, P, SEL, chart;
let PERIOD = { days: 30, from: null, to: null };   // days 가 있으면 "오늘(데이터 기준일)까지 최근 N일"

function rowsIn(page, from, to) { return page.daily.filter((r) => r[0] >= from && r[0] <= to); }
function aggregate(rows, key) {
  if (!rows.length) return null;
  const m = DATA.metrics[key], v = (r, k) => r[IDX[k]];
  if (m.agg === "avg") return rows.reduce((a, r) => a + v(r, key), 0) / rows.length;
  if (m.agg === "weighted") {
    const s = rows.reduce((a, r) => a + v(r, "sessions"), 0);
    return s ? rows.reduce((a, r) => a + v(r, key) * v(r, "sessions"), 0) / s : 0;
  }
  const den = rows.reduce((a, r) => a + v(r, m.den), 0);
  return den ? rows.reduce((a, r) => a + v(r, m.num), 0) / den : 0;
}
function dayValue(r, key) {
  const m = DATA.metrics[key];
  if (m.agg === "ratio") { const den = r[IDX[m.den]]; return den ? r[IDX[m.num]] / den : 0; }
  return r[IDX[key]];
}
function range() {
  const to = PERIOD.days ? DATA.dataThrough : PERIOD.to;
  const from = PERIOD.days ? addDays(to, -(PERIOD.days - 1)) : PERIOD.from;
  const n = diffDays(from, to) + 1;
  return { from, to, n, pFrom: addDays(from, -n), pTo: addDays(from, -1) };
}
/** 페이지의 선택 기간 vs 이전 같은 길이 기간 비교 */
function compare(page, key) {
  const R = range();
  const cur = rowsIn(page, R.from, R.to), prev = rowsIn(page, R.pFrom, R.pTo);
  const c = aggregate(cur, key), p = aggregate(prev, key);
  const prevUsers = prev.reduce((a, r) => a + r[IDX.activeUsers], 0);
  if (prev.length < R.n) return { cur: c, prev: p, delta: null, state: "short" };       // 비교 기간 데이터 부족
  if (!prevUsers && cur.some((r) => r[IDX.activeUsers])) return { cur: c, prev: p, delta: null, state: "new" }; // 이전엔 없던 페이지
  return { cur: c, prev: p, delta: p ? (c - p) / p * 100 : null, state: "ok" };
}

// ---------- 주소창 상태 (#product=…&page=…&days=30 또는 &from=…&to=…)
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("from") && h.get("to")) PERIOD = { days: 0, from: h.get("from"), to: h.get("to") };
  else if (PRESETS.includes(+h.get("days"))) PERIOD = { days: +h.get("days"), from: null, to: null };
  return { product: h.get("product"), page: h.get("page") };
}
function writeHash() {
  const h = new URLSearchParams({ product: P.id });
  if (SEL) h.set("page", SEL.key);
  if (PERIOD.days) h.set("days", PERIOD.days); else { h.set("from", PERIOD.from); h.set("to", PERIOD.to); }
  history.replaceState(null, "", "#" + h.toString());
}

// ---------- 제품 탭
function renderTabs() {
  $("tabs").innerHTML = DATA.products.map((p) =>
    `<button class="tab" role="tab" data-id="${esc(p.id)}" aria-selected="${p.id === P.id}">${esc(p.name)}<span class="count">${p.pages.length}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => selectProduct(b.dataset.id));
}
function selectProduct(id, pageKey) {
  P = DATA.products.find((p) => p.id === id) || DATA.products[0];
  SEL = P.pages.find((r) => r.key === pageKey) || P.pages[0] || null;
  renderTabs(); renderAll();
}
function renderAll() { renderList(); renderDetail(); writeHash(); }

// ---------- 왼쪽: 배포일별 페이지 목록
function renderList() {
  $("list-count").textContent = `활성 사용자 · ${periodLabel()}`;
  if (!P.pages.length) {
    $("list").innerHTML = `<li class="empty">아직 등록된 배포 페이지가 없어요.<br><br><code>releases.json</code>에 <code>"product": "${esc(P.id)}"</code>로 페이지를 추가하면 여기에 나타납니다.</li>`;
    return;
  }
  const groups = [];
  P.pages.forEach((r) => { const g = groups.at(-1); if (g && g.date === r.date) g.items.push(r); else groups.push({ date: r.date, items: [r] }); });
  $("list").innerHTML = groups.map((g) => `
    <li class="group"><div class="gh">${longDate(g.date)} 배포</div><ul>${g.items.map((r) => {
      const c = r.error ? null : compare(r, PRIMARY);
      return `<li><button class="item" data-key="${esc(r.key)}" aria-current="${SEL && r.key === SEL.key}">
        <span class="t" title="${esc(r.name)}">${esc(r.name)}</span>
        <span class="d" title="${esc(pathText(r))}">${esc(pathText(r))}</span>
        <span class="m">${r.error ? '<span class="delta down">오류</span>' : `${deltaHtml(c)}<small>${fmt(c.cur, "int")}명/일</small>`}</span>
      </button></li>`; }).join("")}</ul></li>`).join("");
  $("list").querySelectorAll(".item").forEach((b) => b.onclick = () => {
    SEL = P.pages.find((r) => r.key === b.dataset.key);
    $("list").querySelectorAll(".item").forEach((x) => x.setAttribute("aria-current", String(x === b)));
    renderDetail(); writeHash();
  });
}
const periodLabel = () => (PERIOD.days ? `최근 ${PERIOD.days}일` : `${shortDate(PERIOD.from)}~${shortDate(PERIOD.to)}`);

// ---------- 오른쪽 상세
function syncPeriodControls() {
  const R = range();
  document.querySelectorAll("#presets button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.days === PERIOD.days)));
  const min = SEL && SEL.daily ? SEL.daily[0][0] : "";
  for (const id of ["from", "to"]) { $(id).min = min; $(id).max = DATA.dataThrough; }
  $("from").value = R.from; $("to").value = R.to;
  $("compare").textContent = `${longDate(R.from)} ~ ${longDate(R.to)} (${R.n}일) · 이전 ${R.n}일(${shortDate(R.pFrom)}~${shortDate(R.pTo)}) 대비`;
}

function renderDetail() {
  $("detail").hidden = !SEL;
  if (!SEL) return;
  const r = SEL;
  const since = diffDays(r.date, DATA.dataThrough);
  $("rel-date").textContent = `${longDate(r.date)} 배포` + (since >= 0 ? ` · 배포 후 ${since + 1}일째` : "");
  $("rel-title").textContent = r.name;
  $("rel-sub").innerHTML = `${esc(P.name)} · <code class="path">${esc(pathText(r))}</code>`;
  $("rel-link").hidden = !r.url; if (r.url) $("rel-link").href = r.url;
  syncPeriodControls();

  $("chart-card").hidden = !!r.error;
  $("kpi-error").hidden = !r.error;
  if (r.error) {
    $("kpis").innerHTML = "";
    $("kpi-error").innerHTML = `${esc(r.error)}<br><span class="sub">서비스 계정이 이 제품의 GA4 속성에 <b>뷰어</b>로 추가됐는지 확인해 주세요.</span>`;
    return;
  }
  $("kpis").innerHTML = Object.entries(DATA.metrics).map(([k, m]) => {
    const c = compare(r, k);
    const sub = c.state === "short" ? '<span class="ba" style="margin:0">이전 기간 데이터 부족</span>'
      : c.state === "new" ? `${deltaHtml(c)}<span class="ba">이전 기간엔 방문 없음</span>`
      : `${deltaHtml(c)}<span class="ba">이전 ${fmt(c.prev, m.fmt)}</span>`;
    return `<div class="tile${k === PRIMARY ? " primary" : ""}"><div class="k">${esc(m.label)}</div>
      <div class="v">${fmt(c.cur, m.fmt)}</div><div>${sub}</div></div>`;
  }).join("");
  drawChart($("metric").value);
}

function drawChart(metric) {
  const meta = DATA.metrics[metric], R = range();
  const rows = rowsIn(SEL, R.from, R.to);
  const labels = rows.map((r) => r[0]);
  const values = rows.map((r) => dayValue(r, metric));
  $("chart-title").textContent = `${meta.label} · 일별 추이`;

  // 배포일 표시 (같은 제품의 다른 배포일은 흐리게)
  const releaseDates = [...new Set(P.pages.map((p) => p.date))];
  const marks = releaseDates.map((d) => ({ d, i: labels.indexOf(d), mine: d === SEL.date })).filter((m) => m.i >= 0);
  const out = $("rel-out");
  out.hidden = labels.includes(SEL.date);
  out.textContent = SEL.date < R.from ? `· 이 페이지 배포일(${shortDate(SEL.date)})은 선택 기간 이전이에요` : `· 이 페이지 배포일(${shortDate(SEL.date)})은 선택 기간 이후예요`;

  const plugin = {
    id: "releaseMarks",
    afterDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x } } = c;
      ctx.save();
      marks.forEach((m) => {
        const px = x.getPixelForValue(m.i);
        ctx.globalAlpha = m.mine ? 1 : 0.45; ctx.strokeStyle = css("--release"); ctx.setLineDash([4, 4]); ctx.lineWidth = m.mine ? 1.6 : 1;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.globalAlpha = 1;
        if (!m.mine) return;
        ctx.font = "600 11px -apple-system, 'Apple SD Gothic Neo', sans-serif";
        const text = `${shortDate(m.d)} 배포`, tw = ctx.measureText(text).width + 10;
        const left = px + 4 + tw > a.right ? px - 4 - tw : px + 4;
        ctx.setLineDash([]); ctx.fillStyle = css("--surface"); ctx.fillRect(left, a.top + 2, tw, 18);
        ctx.fillStyle = css("--text"); ctx.textBaseline = "middle"; ctx.fillText(text, left + 5, a.top + 11);
      });
      ctx.restore();
    },
  };
  const few = labels.length <= 31;
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels, datasets: [
      { label: meta.label.replace(" (일평균)", ""), data: values, borderColor: css("--accent"), backgroundColor: css("--accent"), borderWidth: 2,
        pointRadius: few ? 3 : 0, pointHoverRadius: 5, tension: 0.25 },
    ] },
    options: {
      maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--text"), titleColor: css("--surface"), bodyColor: css("--surface"), footerColor: css("--surface"),
          padding: 10, boxPadding: 4, displayColors: false,
          callbacks: {
            title: (items) => { const d = labels[items[0].dataIndex]; return `${d} (${dow(d)})`; },
            label: (c) => ` ${c.dataset.label}: ${fmt(c.parsed.y, meta.fmt)}`,
            footer: (items) => {
              const d = labels[items[0].dataIndex];
              const names = P.pages.filter((p) => p.date === d).map((p) => p.name);
              return names.length ? [`● 배포: ${names.join(", ")}`] : [];
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: css("--muted"), maxTicksLimit: 8, maxRotation: 0, callback: (v) => shortDate(labels[v]) }, grid: { display: false }, border: { color: css("--line") } },
        y: { beginAtZero: meta.fmt !== "pct", ticks: { color: css("--muted"), maxTicksLimit: 6, callback: (v) => fmt(v, meta.fmt) }, grid: { color: css("--line") }, border: { display: false } },
      },
    },
    plugins: [plugin],
  });
}

// ---------- 기간 선택
function setPreset(days) { PERIOD = { days, from: null, to: null }; renderAll(); }
function setCustom() {
  let f = $("from").value, t = $("to").value;
  if (!f || !t) return;
  if (f > t) [f, t] = [t, f];
  if (t > DATA.dataThrough) t = DATA.dataThrough;
  // 같은 날짜가 프리셋과 일치하면 프리셋으로
  const n = diffDays(f, t) + 1;
  PERIOD = t === DATA.dataThrough && PRESETS.includes(n) ? { days: n, from: null, to: null } : { days: 0, from: f, to: t };
  renderAll();
}

// ---------- 시작
fetch("/auth/me", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((u) => { if (u) $("user").innerHTML = `${esc(u.email)} · <a href="/auth/logout" style="color:inherit">로그아웃</a>`; })
  .catch(() => {});

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    if (data.version !== 3) throw new Error("데이터 형식이 이전 버전입니다. 워크플로를 다시 실행해 주세요.");
    DATA = data;
    IDX = Object.fromEntries(data.raw.map((k, i) => [k, i + 1]));
    $("demo").hidden = !data.demo;
    $("meta").textContent = `${longDate(data.dataThrough)}까지 데이터 · 갱신 ${data.updatedAt.replace("T", " ").slice(0, 16)}`;
    const sel = $("metric");
    sel.innerHTML = Object.entries(data.metrics).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join("");
    sel.value = PRIMARY;
    sel.onchange = () => drawChart(sel.value);
    document.querySelectorAll("#presets button").forEach((b) => b.onclick = () => setPreset(+b.dataset.days));
    $("from").addEventListener("change", setCustom);
    $("to").addEventListener("change", setCustom);
    const h = readHash();
    selectProduct(h.product || data.products[0].id, h.page);
  })
  .catch((e) => { $("meta").innerHTML = `<span class="error">데이터를 불러오지 못했습니다 (${esc(e.message)})</span>`; });
</script>
</body>
