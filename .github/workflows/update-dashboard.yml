name: Update GA4 release dashboard

on:
  schedule:
    - cron: "0 0 * * *"        # 매일 09:00 KST
  workflow_dispatch:            # 수동 실행
  repository_dispatch:          # 서비스 저장소에서 릴리스 발행 시 즉시 갱신 (README 참고)
    types: [release-published]
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: ga4-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write service account key
        run: printf '%s' "$GA4_SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}

      - name: Fetch GA4 metrics
        run: python scripts/fetch_ga4.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          RELEASE_REPOS: ${{ vars.RELEASE_REPOS }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS || '7' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
